name: E2E Auth (semanal)

# Corre la suite E2E AUTENTICADA completa (flujos que mutan: crear ronda,
# scoring, finalizar, organizar torneo, importar) contra la app levantada en el
# runner y la BASE DE PRUEBAS (scripts/test-db/e2e-local.mjs).
#
# Hasta el 12-oct corría contra producción: cada corrida creaba data efímera en
# la BD de prod (Supabase Free) y la basura se veía en /en-vivo. Frente 3.4 del
# incidente del torneo Los Leones (04-oct-2026). Ningún secret de prod llega acá.
#
# Por qué semanal y no en cada push: tarda ~30 min. Origen (16-jun-2026): un QA manual
# descubrió que 2 specs de este set (Stableford gross, import celebration)
# llevaban semanas con asserts viejos sin que nadie lo notara — porque NINGÚN
# workflow los ejecutaba. Un test que no corre da falsa confianza. Esto lo cierra.
#
# Triggers:
#   - schedule: domingo → red de seguridad semanal de los flujos críticos.
#   - workflow_dispatch → manual desde la UI.

on:
  schedule:
    # Domingo 13:00 UTC (~09:00 Chile).
    - cron: '0 13 * * 0'
  workflow_dispatch:

# Mismo grupo que integracion.yml y test-db-sync.yml: el sync diario vacía y reconstruye la base de pruebas, y
# esta suite escribe en ella.
concurrency:
  group: base-de-pruebas
  cancel-in-progress: false

jobs:
  e2e-auth:
    name: Playwright auth suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_E2E_USER_EMAIL: ${{ secrets.TEST_E2E_USER_EMAIL }}
      TEST_E2E_USER_PASSWORD: ${{ secrets.TEST_E2E_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # e2e-local.mjs aborta si falta un TEST_* o si la URL de pruebas fuera la de prod.
      - name: Run authenticated E2E suite (app local + base de pruebas)
        run: node scripts/test-db/e2e-local.mjs -- --project=mobile-chromium-auth

      - name: Barrer basura de tests en la base de pruebas (> 60 min)
        if: always()
        continue-on-error: true
        run: node scripts/test-db/con-base-de-pruebas.mjs -- npm run test:e2e:sweep

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-auth-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
