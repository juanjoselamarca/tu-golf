# supabase/schema.sql tiene que ser el esquema que dejan las migraciones. Este check lo regenera en un Postgres
# desechable (scripts/ci/esquema.mjs) y falla si el del PR es otro. Sin Docker en el equipo, el archivo correcto queda
# como artifact `schema-sql` de este run: reemplazar supabase/schema.sql por ese y commitear.
# En main detecta lo que ningún PR ve solo: dos PRs con migración que pasaron cada uno por su lado.
name: Esquema

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/schema.sql'
      - 'scripts/ci/esquema.mjs'
      - 'scripts/test-db/sync-schema.mjs'
      - 'scripts/lib/management-sql.mjs'
      - '.github/workflows/esquema.yml'
      - 'scripts/ci/pruebas-sql/**'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/schema.sql'
      - 'scripts/ci/esquema.mjs'
      - 'scripts/test-db/sync-schema.mjs'
      - 'scripts/lib/management-sql.mjs'
      - '.github/workflows/esquema.yml'
      - 'scripts/ci/pruebas-sql/**'

jobs:
  esquema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Regenerar supabase/schema.sql desde las migraciones (y correr las pruebas SQL)
        id: regenerar
        run: node scripts/ci/esquema.mjs --pruebas-sql "$RUNNER_TEMP/pruebas-sql.txt"

      - name: Comparar con el del PR
        id: comparar
        # -N: si el PR borró el archivo, el regenerado aparece en el diff en vez de quedar como no rastreado.
        run: git add -N supabase/schema.sql && git diff --exit-code supabase/schema.sql

      - name: Dejar el archivo correcto como artifact
        if: failure() && steps.comparar.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: schema-sql
          path: supabase/schema.sql

      # RLS, GRANT y RPC con roles reales (scripts/ci/pruebas-sql). Va al final para que el esquema se compare y
      # el artifact se suba aunque una prueba falle.
      - name: Pruebas SQL con roles reales
        if: always() && steps.regenerar.outcome == 'success'
        run: |
          cat "$RUNNER_TEMP/pruebas-sql.txt"
          tail -n 1 "$RUNNER_TEMP/pruebas-sql.txt" | grep -qx 'RESULTADO: OK'
