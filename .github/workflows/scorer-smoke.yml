name: Scorer Smoke

# El test más importante de toda la CI. Razón de existir documentada en
# e2e/scorer-smoke.spec.ts. TL;DR: 12-may-2026 Juanjo descubrió en cancha
# que el scorer renderizaba pantalla blanca. Tardó 28 días en detectarse.
# Este workflow cierra ese hueco.
#
# Triggers:
#   - schedule: 4 veces al día.
#   - push a main → atrapa el bug antes que cualquier usuario lo vea.
#   - pull_request a main → cierra el círculo: PRs no se mergean si rompen
#     la pantalla más crítica.
#   - workflow_dispatch → manual desde GitHub UI.
#
# Si este workflow falla, GitHub te manda email automático (config en tu
# perfil → Notifications → Actions). En el futuro podemos opcionalmente
# abrir un Issue auto (gh issue create) — por ahora keepamos lean.
#
# CONTRA QUÉ CORRE (frente 3.4 del incidente del torneo Los Leones, 04-oct-2026): siempre la app del commit
# levantada en el runner (`next start`) contra la BASE DE PRUEBAS (scripts/test-db/e2e-local.mjs). Ningún secret
# de prod llega acá. Hasta el 20-oct el programado y el push a main corrían contra prod y cada corrida creaba y
# borraba una ronda en la BD de prod. El deploy real lo vigilan el smoke de páginas públicas de ci.yml (job
# e2e-smoke, anónimo y sin escrituras) y el monitor de caídas.

on:
  schedule:
    # 08, 12, 16 y 20 Chile = 11, 15, 19 y 23 UTC.
    - cron: '0 11,15,19,23 * * *'
  push:
    branches: [main]
    # Solo cuando cambia código que esta suite ejercita.
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'scripts/ci/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'scripts/monitor/**'
      - 'scripts/test-db/**'
      - '.github/workflows/scorer-smoke.yml'
  pull_request:
    branches: [main]
    # Solo cuando cambia código que esta suite ejercita.
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'scripts/ci/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'scripts/monitor/**'
      - 'scripts/test-db/**'
      - '.github/workflows/scorer-smoke.yml'
  workflow_dispatch:

# Sólo permitir un run a la vez por ref — evita pisarse en cron + push simultáneo.
concurrency:
  group: scorer-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Playwright scorer smoke (base de pruebas)
    # Un PR desde un fork no recibe los secrets TEST_*.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_E2E_USER_EMAIL: ${{ secrets.TEST_E2E_USER_EMAIL }}
      TEST_E2E_USER_PASSWORD: ${{ secrets.TEST_E2E_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # e2e-local.mjs aborta si falta un TEST_* o si la URL de pruebas fuera la de prod: sin esta guarda el spec
      # se saltearía en silencio y el check quedaría verde sin haber probado nada.
      - name: Scorer smoke — app del commit contra la base de pruebas
        id: smoke
        run: node scripts/test-db/e2e-local.mjs -- scorer-smoke.spec.ts --project=mobile-chromium-auth

      # Fuera de un PR (programado / push a main) un rojo es el código de main, que es el de prod: el 02-oct
      # falló a las 20:38 y nadie se enteró en 4 h. Avisa por Telegram.
      - name: Avisar por Telegram si falla fuera de un PR
        if: failure() && steps.smoke.outcome == 'failure' && github.event_name != 'pull_request'
        run: node scripts/monitor/uptime.mjs --notify "$AVISO"
        env:
          AVISO: "🔴 Scorer smoke FALLÓ (${{ github.event_name }}) con el código de main contra la base de pruebas: el scorer de main puede estar roto, o la base de pruebas caída. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}

      - name: Upload Playwright trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
