name: Import Canary

# Canario end-to-end del pipeline de importación contra el schema REAL de prod.
#
# Por qué existe: el 2026-06-08 se colaron 3 bugs de importación que los unit
# tests con MOCK no agarraron (columna `source` inexistente → usuario nuevo
# importó 125 rondas y quedó con 0; tee de la foto descartado → sin CR/slope).
# El `npm run test` de CI corre con credenciales placeholder → los integration
# tests se SALTEAN ahí. Este workflow los corre con secrets reales para que un PR
# que rompa la importación NO se pueda mergear.
#
# Triggers:
#   - pull_request a main → bloquea el merge si rompe la importación.
#   - push a main → atrapa drift apenas entra.
#   - schedule cada 6h → atrapa corrupción operacional (schema drift, RPC, etc.).
#   - workflow_dispatch → manual.

on:
  pull_request:
    branches: [main]
    # Solo cuando cambia código que estas suites ejercitan (incidente 02-oct: la BD de prod es free, ~0,5 GB;
    # cualquier PR de scripts/docs disparaba corridas contra prod que había que cancelar a mano).
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'scripts/ci/**'
      - '.github/workflows/import-canary.yml'
  push:
    branches: [main]
    # Solo cuando cambia código que estas suites ejercitan (incidente 02-oct: la BD de prod es free, ~0,5 GB;
    # cualquier PR de scripts/docs disparaba corridas contra prod que había que cancelar a mano).
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'scripts/ci/**'
      - '.github/workflows/import-canary.yml'
  # Cron eliminado 2026-08-31: el schedule cada 6h no atrapó ningún bug real
  # y generaba ~4 emails/día cuando fallaba por data huérfana en prod.
  # Los triggers push + PR son suficientes — protegen cada cambio de código.
  workflow_dispatch:

# Un run a la vez por ref (evita pisarse cron + push). Distintos PRs corren en
# paralelo sin colisión: cada test borra SOLO las rondas que él mismo insertó.
concurrency:
  group: import-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Vitest import canary (schema real)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # el turno de prod lee las corridas en curso
    timeout-minutes: 20   # +12 por el turno de prod (scripts/ci/wait-prod-turn.mjs)

    env:
      # Mismo mapeo de secrets que scorer-smoke.yml / e2e-trigger.yml.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Esperar turno de prod (no saturar la BD con suites en paralelo)
        run: node scripts/ci/wait-prod-turn.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run import canary (importRound → BD → CR/slope + diferencial)
        run: node ./node_modules/vitest/vitest.mjs run src/__tests__/integration/import-pipeline.test.ts
