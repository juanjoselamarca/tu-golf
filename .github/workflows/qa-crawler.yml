name: QA Crawler de botones

# Recorre la app y prueba cada botón/enlace/tab/modal en
# aislamiento (excepción JS, 4xx/5xx, 404/error-boundary, console.error).
# Origen: 16-jun-2026, el crawler detectó un P1 de clipboard que ningún test
# cubría. Este workflow cierra el hueco de regresión de interacciones.
#
# CONTRA QUÉ CORRE: la app de main levantada en el runner contra la BASE DE PRUEBAS (scripts/test-db/e2e-local.mjs),
# logueado con el usuario E2E de esa base. Hasta el 20-oct corría contra prod (frente 3.4 del incidente del torneo
# Los Leones, 04-oct-2026). Ningún secret de prod llega acá.
#
# Triggers:
#   - schedule: semanal (lunes) → detecta botones rotos por deploys/cambios
#     sin que un usuario tenga que toparse con el error en cancha.
#   - workflow_dispatch → manual, con cap/modo configurables.
#
# Falla (exit 1) si encuentra algún P1. GitHub manda email automático.

on:
  schedule:
    # Lunes 12:00 UTC (~08:00 Chile). 1 run/semana × ~30 min — costo trivial.
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      maxel:
        description: 'Máximo de elementos por ruta'
        required: false
        type: string
        default: '60'
      admin:
        description: '¿Incluir rutas /admin/*?'
        required: false
        type: boolean
        default: false

concurrency:
  group: qa-crawler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawler de botones (readonly)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35   # 25 del deadline del crawler + build y arranque de la app local

    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_E2E_USER_EMAIL: ${{ secrets.TEST_E2E_USER_EMAIL }}
      TEST_E2E_USER_PASSWORD: ${{ secrets.TEST_E2E_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # e2e-local.mjs aborta si falta un TEST_* o si la URL de pruebas fuera la de prod, y le pasa al crawler
      # CRAWL_BASE_URL=localhost y el usuario E2E de la base de pruebas.
      - name: Run crawler (readonly, falla si hay P1)
        run: >
          node scripts/test-db/e2e-local.mjs --comando --
          node scripts/qa-crawler.mjs
          --mode=readonly
          --depth=2
          --maxel=${{ inputs.maxel || '60' }}
          ${{ (inputs.admin && '--admin') || '' }}

      - name: Upload reporte del crawler
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-crawler-report-${{ github.run_id }}
          path: qa-crawler-report/
          retention-days: 30
