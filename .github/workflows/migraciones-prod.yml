# Única vía para cambiar el esquema de prod (item 5 de docs/PLAN-MAX.md): aplica con la CLI de Supabase lo que está
# en main y falta en supabase_migrations.schema_migrations. El environment migraciones-prod (solo main, aprobación de
# Max o Juanjo) guarda el único token con permiso de escritura.
#
# Tras el db push guarda la huella del esquema (scripts/ci/deriva-esquema.mjs) como artifact: es la referencia con la
# que prod-canarios detecta cada noche cambios hechos por fuera de una migración. Re-correrlo a mano la renueva.
#
# Turno de prod + evento en vivo: wait-prod-turn.mjs FALLA si hay gente jugando; se re-corre a mano al terminar.

name: Migraciones a prod

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/*.sql']
  workflow_dispatch:

concurrency:
  group: migraciones-prod
  cancel-in-progress: false

jobs:
  aplicar:
    name: Aplicar migraciones a prod
    runs-on: ubuntu-latest
    environment: migraciones-prod
    permissions:
      contents: read
      actions: read   # el turno de prod lee las corridas en curso
    timeout-minutes: 25   # +12 por el turno de prod (scripts/ci/wait-prod-turn.mjs)

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Esperar turno de prod (no saturar la BD con suites en paralelo)
        run: node scripts/ci/wait-prod-turn.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENTO_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EVENTO_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Un solo paso: el turno cubre al paso que le sigue, y los canarios también golpean prod.
      - name: Aplicar migraciones pendientes y correr los canarios de prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          ref="${NEXT_PUBLIC_SUPABASE_URL#https://}"
          supabase link --project-ref "${ref%%.*}"
          supabase db push --linked --include-all --dry-run 2>&1 | tee pendientes.txt
          # Todo lo anterior al backfill del 13-oct ya está en el ledger. Si aparece como pendiente, el ledger perdió
          # filas y db push reaplicaría migraciones viejas.
          viejas=$(grep -oE '^ • [0-9]{14}' pendientes.txt | awk '$2 <= 20261013000000 { printf "%s ", $2 }')
          if [ -n "$viejas" ]; then
            echo "::error::Pendientes anteriores al backfill del ledger ($viejas). No se aplica nada."
            exit 1
          fi
          supabase db push --linked --include-all --yes
          # La huella va antes que los canarios: si uno falla, la referencia igual queda con lo que se aplicó.
          huella=0; node scripts/ci/deriva-esquema.mjs --guardar huella-esquema.json || huella=$?
          node ./node_modules/vitest/vitest.mjs run src/__tests__/prod --retry=2 --hookTimeout=60000 --no-file-parallelism
          exit $huella

      - name: Subir la huella del esquema (referencia del chequeo nocturno de deriva)
        if: always() && hashFiles('huella-esquema.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: huella-esquema
          path: huella-esquema.json
          retention-days: 90
          if-no-files-found: error

      - name: Avisar por Telegram si falló
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module -e "
            import { sendNew } from './scripts/ceo/telegram.mjs'
            await sendNew('⚠️ Golfers+: falló la aplicación de migraciones a prod, un canario posterior o el guardado de la huella del esquema.\n' + process.env.RUN_URL, m => console.log(m))
          "
