# Base de pruebas: copia diaria del esquema de prod + seed mínimo (frente 3.2 del incidente del torneo
# Los Leones, 04-oct-2026 — docs/INCIDENTE_TORNEO_LEONES_2026-10-04.md).
#
# POR QUÉ EXISTE. El CI (integracion.yml y el ex import-canary.yml) corría contra la BD de PRODUCCIÓN (Supabase Free,
# 0,5 GB) y ayudó a tumbarla en pleno torneo. La base de pruebas es un 2º proyecto Free (`golfersplus-test`,
# $0) donde el CI puede escribir y borrar sin tocar a nadie. Para que los tests sigan probando lo real, su
# esquema se reconstruye cada día desde prod viva y se compara objeto por objeto (sync-schema.mjs falla si
# difiere). Manual completo: docs/claude/base-de-pruebas.md.
#
# Además la mantiene VIVA: Supabase pausa un proyecto Free tras 7 días sin actividad. El ping corre siempre,
# aunque el resto se salte por evento en vivo.
#
# Carga sobre prod: sólo lecturas de catálogo (~15 consultas chicas) y ~25 tablas de catálogo/fixtures, de a
# una y con pausa. Nada se escribe en prod: las guardas de scripts/test-db/proyectos.mjs abortan si el destino
# no es, por nombre, el proyecto de pruebas.
#
# Secretos: SUPABASE_ACCESS_TOKEN vive en el environment `base-de-pruebas`, restringido a la rama main (un PR
# no puede leerlo). Los TEST_* son secrets del repo: los usará integracion.yml en los PRs (frente 3.3).

name: Base de pruebas (sync diario)

on:
  schedule:
    - cron: '0 5 * * *'   # 02:00 Chile (verano 02:00 / invierno 01:00): sin juego, antes de los agentes de la mañana
  workflow_dispatch:

# Mismo grupo que deben usar los workflows que corren tests contra la base de pruebas (frente 3.3): el rebuild
# vacía `public` y recrea las cuentas; no puede pisar una corrida de tests a mitad.
concurrency:
  group: base-de-pruebas
  cancel-in-progress: false

jobs:
  sync:
    name: Esquema de prod → base de pruebas + seed
    runs-on: ubuntu-latest
    environment: base-de-pruebas
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Mantener viva la base de pruebas (Free se pausa tras 7 días sin actividad)
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$TEST_SUPABASE_URL/rest/v1/courses?select=id&limit=1" \
            -H "apikey: $TEST_SUPABASE_ANON_KEY" -H "Authorization: Bearer $TEST_SUPABASE_ANON_KEY")
          echo "ping base de pruebas: HTTP $code"
          # Un 4xx/5xx no corta el job: el sync de abajo dice si la base está pausada o rota.

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Regla 6 / incidente Los Leones: con gente jugando no se lee prod. Exit 3 = evento → se salta el sync
      # (el ping de arriba ya mantuvo viva la base); cualquier otro error del chequeo sí falla.
      - name: ¿Evento en vivo?
        id: evento
        env:
          EVENTO_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EVENTO_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          node scripts/ci/evento-en-vivo.mjs
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "vivo=true" >> "$GITHUB_OUTPUT"; echo "::warning::Evento en vivo: hoy no se sincroniza la base de pruebas."; exit 0; fi
          [ "$rc" = "0" ] || exit "$rc"
          echo "vivo=false" >> "$GITHUB_OUTPUT"

      - name: Clonar el esquema de prod (y verificar que quedó idéntico)
        if: steps.evento.outputs.vivo == 'false'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/test-db/sync-schema.mjs

      - name: Seed (catálogo + fixtures + usuario E2E)
        if: steps.evento.outputs.vivo == 'false'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_E2E_USER_PASSWORD: ${{ secrets.TEST_E2E_USER_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/test-db/seed.mjs

      # Un rojo acá significa que los tests del CI correrán contra una base desactualizada o vacía: avisar.
      - name: Avisar por Telegram si falló
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module -e "
            import { sendNew } from './scripts/ceo/telegram.mjs'
            await sendNew('⚠️ Golfers+: falló el sync diario de la base de pruebas (los tests del CI pueden quedar contra un esquema viejo).\n' + process.env.RUN_URL + '\nManual: docs/claude/base-de-pruebas.md', m => console.log(m))
          "
